
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShannonsCord</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="home-container">

        <!-- Servidores -->
        <aside class="servers">

            <div class="server-logo">
                S
            </div>

            <div class="server">
                +
            </div>

            <div class="server">
                #
            </div>

        </aside>

        <!-- Canais -->
        <aside class="channels">

            <div class="channels-header">
                <h2>ShannonsCord</h2>
            </div>

            <div class="channels-list">

                <p class="channel-title">CANAIS DE TEXTO</p>

                <a class="channel" href="#">
                    # geral
                </a>

                <a class="channel" href="#">
                    # conversa
                </a>

                <p class="channel-title">CANAIS DE VOZ</p>

                <a class="channel" href="#">
                    🔊 Geral
                </a>

            </div>

            <div class="user-area">

                <div class="user-info">
                    <div class="user-avatar">
                        R
                    </div>

                    <div>
                        <p class="username">Rodzin</p>
                        <p class="user-status">Online</p>
                    </div>
                </div>

                <button class="user-button">
                    ⚙
                </button>

            </div>

        </aside>

        <!-- Chat -->
        <section class="chat">

            <header class="chat-header">
                <h2># geral</h2>
            </header>

            <div class="messages">

                <div class="message">

                    <div class="message-avatar">
                        R
                    </div>

                    <div class="message-content">

                        <div class="message-info">
                            <strong>Rodzin</strong>
                            <span>Hoje às 22:30</span>
                        </div>

                        <p>
                            Bem-vindo ao ShannonsCord!
                        </p>

                    </div>

                </div>

                <div class="message">

                    <div class="message-avatar">
                        H
                    </div>

                    <div class="message-content">

                        <div class="message-info">
                            <strong>Henrique</strong>
                            <span>Hoje às 22:31</span>
                        </div>

                        <p>
                            Nosso projeto está começando!
                        </p>

                    </div>

                </div>

            </div>

            <form class="message-form">

                <input
                    class="message-input"
                    type="text"
                    placeholder="Enviar mensagem em #geral"
                >

                <button class="message-button" type="submit">
                    Enviar
                </button>

            </form>

        </section>

        <!-- Membros -->
        <aside class="members">

            <h3>MEMBROS — 2</h3>

            <div class="member">

                <div class="member-avatar">
                    R
                </div>

                <span>Rodzin</span>

            </div>

            <div class="member">

                <div class="member-avatar">
                    H
                </div>

                <span>Henrique</span>

            </div>

        </aside>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
