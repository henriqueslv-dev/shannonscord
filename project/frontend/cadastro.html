
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShannonsCord - Cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-box">

            <h1 class="logo">ShannonsCord</h1>

            <p class="subtitle">Crie sua conta</p>

            <form class="login-form" id="cadastro-form">

                <label class="form-label" for="nome">Nome</label>
                <input
                    class="form-input"
                    type="text"
                    id="cadastro-nome"
                    placeholder="Digite seu nome"
                >

                <label class="form-label" for="username">Username</label>
                <input
                    class="form-input"
                    type="text"
                    id="cadastro-username"
                    placeholder="Escolha seu username"
                >

                <label class="form-label" for="email">Email</label>
                <input
                    class="form-input"
                    type="email"
                    id="cadastro-email"
                    placeholder="Digite seu email"
                >

                <label class="form-label" for="senha">Senha</label>
                <input
                    class="form-input"
                    type="password"
                    id="cadastro-senha"
                    placeholder="Crie uma senha"
                >

                <label class="form-label" for="confirmar-senha">
                    Confirmar senha
                </label>

                <input
                    class="form-input"
                    type="password"
                    id="cadastro-confirmar"
                    placeholder="Confirme sua senha"
                >

                <button class="form-button" type="submit">
                    Criar conta
                </button>

            </form>

            <p class="register-text">
                Já possui uma conta?
                <a class="register-link" href="index.html">
                    Entrar
                </a>
            </p>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
